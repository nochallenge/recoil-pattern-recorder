[package]
name = "recoil-trainer"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Desktop app for recording and visualizing FPS recoil patterns"
authors = []

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
rdev = "0.5"
serialport = "4.3"
rand = "0.8"
noise = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
parking_lot = "0.12"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = true
codegen-units = 1
strip = true
